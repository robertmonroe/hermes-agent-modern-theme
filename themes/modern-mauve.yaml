# Hermes Agent Modern Theme: Mauve
# Generated by make_themes.py. Edit style.css / palettes.json and rebuild instead of editing this file.
name: modern-mauve
label: Modern Mauve
description: Modern flat style, mauve palette

palette:
  background: "#0c090c"
  midground: "#fafafa"
  foreground: { hex: "#e7e4e7", alpha: 0 }
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  fontUrl: "https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
  fontSans: "'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
  fontMono: "'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace"
  fontDisplay: "'Geist', ui-sans-serif, system-ui, sans-serif"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.625rem"
  density: comfortable

colorOverrides:
  card: "#1d161e"
  cardForeground: "#fafafa"
  popover: "#1d161e"
  popoverForeground: "#fafafa"
  primary: "#e7e4e7"
  primaryForeground: "#1d161e"
  secondary: "#2a212c"
  secondaryForeground: "#fafafa"
  muted: "#2a212c"
  mutedForeground: "#a89ea9"
  accent: "#2a212c"
  accentForeground: "#fafafa"
  destructive: "#ff6467"
  destructiveForeground: "#fafafa"
  success: "#4ade80"
  warning: "#fbbf24"
  border: "rgba(255, 255, 255, 0.10)"
  input: "rgba(255, 255, 255, 0.15)"
  ring: "#79697b"

customCSS: |
  :root {
    --sh-bg: #0c090c;
    --sh-card: #1d161e;
    --sh-surface: #2a212c;
    --sh-fg: #fafafa;
    --sh-muted: #a89ea9;
    --sh-ring: #79697b;
    --sh-primary: #e7e4e7;
    --sh-primary-fg: #1d161e;
    --sh-border: rgba(255, 255, 255, 0.10);
    --sh-input: rgba(255, 255, 255, 0.15);
  }
  /* Hermes Agent Modern Theme: the shared style, used by every palette.
     Colors come only from the --sh-* variables; make_themes.py fills them in
     per palette. Edit this file, then rerun make_themes.py. */

  body { -webkit-font-smoothing: antialiased; }
  ::selection { background: color-mix(in srgb, var(--sh-primary) 35%, transparent); }

  /* ---------- typography: one family, sentence case, no tracking ---------- */
  .font-mondwest, .font-compressed, .font-expanded, .font-collapse,
  .font-courier, .font-display, button.font-mono {
    font-family: var(--theme-font-sans) !important;
  }
  .uppercase { text-transform: none !important; }
  [class*="tracking-["], .tracking-wide, .tracking-wider, .tracking-widest {
    letter-spacing: normal !important;
  }
  h1, h2, h3 { letter-spacing: -0.015em !important; }
  h1 { font-size: 15px !important; font-weight: 600 !important; }
  h3 { font-size: 15px !important; font-weight: 600 !important; }
  .grain::after { display: none !important; }

  /* ---------- borders: hairline everywhere ---------- */
  [class*="border-current/"], [class*="border-midground/"] {
    border-color: var(--sh-border) !important;
  }

  /* ---------- sidebar ---------- */
  #app-sidebar { background: var(--sh-card) !important; border-color: var(--sh-border) !important; }
  #app-sidebar a[class*="group/nav"] {
    margin: 1px 8px; padding: 6px 10px !important; gap: 10px !important;
    border-radius: 6px; font-size: 14px !important; font-weight: 500;
    color: var(--sh-muted) !important;
    transition: background-color .12s ease, color .12s ease;
  }
  #app-sidebar a[class*="group/nav"] svg { width: 16px; height: 16px; opacity: .9; }
  #app-sidebar a[class*="group/nav"]:hover { background: var(--sh-surface); color: var(--sh-fg) !important; }
  #app-sidebar a[class*="group/nav"][aria-current="page"] {
    background: color-mix(in srgb, var(--sh-primary) 14%, var(--sh-surface));
    color: var(--sh-fg) !important;
  }
  #app-sidebar a[class*="group/nav"][aria-current="page"] svg { color: var(--sh-primary); opacity: 1; }
  #app-sidebar a[class*="group/nav"] > span.absolute { display: none !important; }
  #app-sidebar span[class*="leading-[0.95]"] {
    font-size: 15px !important; font-weight: 600 !important;
    line-height: 1.15 !important; letter-spacing: -0.015em !important;
  }

  /* ---------- buttons: flat outline + primary ---------- */
  button[class*="shadow-[inset"] {
    box-shadow: none !important;
    border: 1px solid var(--sh-input) !important;
    border-radius: 6px !important;
    background: transparent !important;
    font-size: 13px !important; font-weight: 500 !important;
    padding: 6px 12px !important; gap: 6px; line-height: 20px !important;
    transition: background-color .12s ease;
  }
  button[class*="shadow-[inset"]:hover { background: var(--sh-surface) !important; }
  button[class*="shadow-[inset"]:active { filter: none !important; }
  button.bg-midground, a.bg-midground {
    background: var(--sh-primary) !important; color: var(--sh-primary-fg) !important;
    border-radius: 6px;
  }

  /* ---------- segmented toggles -> pill tabs ---------- */
  .inline-flex.border.w-fit {
    background: var(--sh-surface) !important; border: 0 !important;
    border-radius: 8px; padding: 3px; gap: 2px;
  }
  .inline-flex.border.w-fit > button {
    border: 0 !important; border-radius: 6px; height: 28px !important;
    font-weight: 500; color: var(--sh-muted) !important; background: transparent !important;
  }
  .inline-flex.border.w-fit > button.bg-midground {
    background: var(--sh-bg) !important; color: var(--sh-fg) !important;
    box-shadow: 0 0 0 1px var(--sh-input);
  }

  /* ---------- cards & rows ---------- */
  main [class~="border"]:not(button):not(a):not(span):not(input):not(select):not(textarea):not(.inline-flex) {
    border-radius: 12px;
  }
  main [class~="border"] [class~="border"]:not(button):not(a):not(span):not(input):not(select):not(textarea):not(.inline-flex) {
    border-radius: 8px;
  }
  main .border.bg-background-base\/80 { background: var(--sh-card) !important; }

  /* ---------- muted secondary text ---------- */
  .text-muted-foreground, .text-text-secondary, main .font-mono-ui {
    color: var(--sh-muted) !important;
  }

  /* ---------- badges ---------- */
  span[class*="font-compressed"][class*="border"] {
    border-radius: 6px; font-size: 12px !important; font-weight: 500;
    padding: 2px 8px !important;
  }

  /* ---------- form controls ---------- */
  input, select, textarea {
    border-radius: 6px !important; border-color: var(--sh-input) !important;
  }
  /* dropdowns: the button matches inputs, the open list matches cards */
  button[role="combobox"] { border-radius: 6px !important; border-color: var(--sh-input) !important; }
  [role="listbox"] { border-radius: 8px !important; overflow: hidden; }

  /* toggles: 32x18 pill, 16px round knob; accent track when on, faint track when off */
  button[role="switch"] {
    width: 32px !important; height: 18.4px !important; padding: 0 !important;
    border: 1px solid transparent !important; border-radius: 999px !important;
    background: color-mix(in srgb, var(--sh-input) 80%, transparent) !important;
    transition: background-color .15s ease !important;
  }
  button[role="switch"] > span {
    width: 16px !important; height: 16px !important; border-radius: 999px !important;
    background: var(--sh-fg) !important; translate: 0 0 !important;
    transition: translate .15s ease !important;
  }
  button[role="switch"][aria-checked="true"] { background: var(--sh-primary) !important; }
  button[role="switch"][aria-checked="true"] > span {
    background: var(--sh-primary-fg) !important; translate: 14px 0 !important;
  }

  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: none !important;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--sh-ring) 50%, transparent) !important;
  }

  /* ---------- Achievements plugin page ----------
     Surfaces, text and borders follow the theme. The tier color (copper,
     silver, gold, diamond, olympian) stays only on the icon, tier badge,
     tier dots and progress bar, so tiers are still easy to tell apart. */
  .ha-kicker, .ha-stat-label, .ha-tier-badge, .ha-state-badge, .ha-criteria summary,
  .ha-evidence-label, .ha-guide strong, .ha-tier-step, .ha-share-trigger, .ha-share-btn,
  .ha-scan-status strong, .ha-scan-banner-text strong, .ha-share-head strong,
  .ha-progress-text, .ha-loading, .ha-share-placeholder {
    font-family: var(--theme-font-sans) !important;
    text-transform: none !important; letter-spacing: normal !important;
  }
  .ha-page [class*="ha-tier-"] { box-shadow: none !important; }
  .ha-hero, .ha-guide > div, .ha-scan-status, .ha-scan-banner, .ha-share-dialog {
    background: var(--sh-card) !important; border-color: var(--sh-border) !important;
    border-radius: 12px;
  }
  .ha-hero:before { display: none !important; }
  .ha-kicker { font-size: 13px !important; color: var(--sh-muted) !important; }
  .ha-stat-label { font-size: 13px !important; }
  .ha-guide strong { font-size: 14px !important; font-weight: 600; color: var(--sh-fg); }

  /* filter buttons -> pill tabs */
  .ha-pills { background: var(--sh-surface); border-radius: 8px; padding: 3px; gap: 2px !important; }
  .ha-pills button {
    border: 0 !important; border-radius: 6px; background: transparent !important;
    color: var(--sh-muted) !important; font-size: 13px !important; font-weight: 500;
    padding: 4px 10px !important;
  }
  .ha-pills button:hover { color: var(--sh-fg) !important; }
  .ha-pills button.active {
    background: var(--sh-bg) !important; color: var(--sh-fg) !important;
    box-shadow: 0 0 0 1px var(--sh-input);
  }

  /* achievement cards */
  .ha-card {
    background: var(--sh-card) !important; border: 1px solid var(--sh-border) !important;
    border-radius: 12px; transition: border-color .12s ease !important;
  }
  .ha-card:hover { border-color: var(--sh-input) !important; }
  .ha-lucide { filter: none !important; }
  .ha-card-title { font-weight: 600 !important; letter-spacing: -0.01em !important; }
  .ha-description { font-size: 14px !important; }
  .ha-tier-badge, .ha-state-badge {
    border: 1px solid var(--sh-border) !important; background: var(--sh-surface) !important;
    border-radius: 6px; font-size: 12px !important; font-weight: 500; padding: 1px 8px !important;
  }
  .ha-state-badge { color: var(--sh-muted) !important; }
  .ha-criteria {
    border: 1px solid var(--sh-border) !important; background: transparent !important;
    border-radius: 8px; overflow: hidden;
  }
  .ha-criteria summary { color: var(--sh-muted) !important; font-size: 13px !important; }
  .ha-criteria summary:hover { background: var(--sh-surface) !important; color: var(--sh-fg) !important; }
  .ha-criteria p { border-top-color: var(--sh-border) !important; color: var(--sh-muted) !important; font-size: 13px !important; }
  .ha-evidence-label { color: var(--sh-muted); }
  .ha-progress-track, .ha-scan-progress-track {
    height: 6px !important; border: 0 !important; border-radius: 999px;
    background: var(--sh-surface) !important;
  }
  .ha-progress-fill { background: var(--ha-tier) !important; border-radius: 999px; }
  .ha-scan-progress-fill { background: var(--sh-primary) !important; border-radius: 999px; }
  .ha-progress-text { font-variant-numeric: tabular-nums; font-size: 12px !important; }
  .ha-state-secret:after { display: none !important; }

  /* recent unlocks + tier legend */
  .ha-chip {
    border: 1px solid var(--sh-border) !important; background: var(--sh-card) !important;
    color: var(--sh-fg) !important; border-radius: 6px; font-size: 13px !important;
  }
  .ha-chip-icon { color: var(--ha-tier); }
  .ha-tier-step {
    border: 1px solid var(--sh-border) !important; background: var(--sh-surface) !important;
    color: var(--sh-fg) !important; border-radius: 6px; font-size: 12px !important;
  }
  .ha-tier-step i { border-radius: 999px; }

  /* scan status, share dialog, odds and ends */
  .ha-scan-pulse, .ha-slot-star { background: var(--sh-primary) !important; color: var(--sh-primary); animation: none !important; box-shadow: none !important; }
  .ha-slot-star { background: none !important; }
  .ha-share-trigger {
    border: 1px solid var(--sh-input) !important; background: transparent !important;
    color: var(--sh-fg) !important; border-radius: 6px; font-size: 12px !important;
  }
  .ha-share-trigger:hover { background: var(--sh-surface) !important; }
  .ha-share-btn, .ha-share-close { border-radius: 6px; border-color: var(--sh-input) !important; }
  .ha-share-btn { font-size: 13px !important; font-weight: 500; }
  .ha-share-btn-primary {
    background: var(--sh-primary) !important; color: var(--sh-primary-fg) !important;
    border-color: transparent !important;
  }
  .ha-share-preview { border-radius: 8px; }
  .ha-skeleton { border-radius: 6px !important; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
