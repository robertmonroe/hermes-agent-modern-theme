# Hermes Agent Modern Theme: Teal
# Generated by make_themes.py. Edit style.css / palettes.json and rebuild instead of editing this file.
name: modern-teal
label: Modern Teal
description: Modern flat style, teal palette

palette:
  background: "#081515"
  midground: "#f0fdfa"
  foreground: { hex: "#00d5be", alpha: 0 }
  warmGlow: "rgba(0, 0, 0, 0)"
  noiseOpacity: 0

typography:
  fontUrl: "https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
  fontSans: "'Geist', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif"
  fontMono: "'Geist Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace"
  fontDisplay: "'Geist', ui-sans-serif, system-ui, sans-serif"
  baseSize: "14px"
  lineHeight: "1.5"
  letterSpacing: "0"

layout:
  radius: "0.625rem"
  density: comfortable

colorOverrides:
  card: "#0b2221"
  cardForeground: "#f0fdfa"
  popover: "#0b2221"
  popoverForeground: "#f0fdfa"
  primary: "#00d5be"
  primaryForeground: "#022f2e"
  secondary: "#1a3836"
  secondaryForeground: "#f0fdfa"
  muted: "#1a3836"
  mutedForeground: "#7ec0b7"
  accent: "#1a3836"
  accentForeground: "#f0fdfa"
  destructive: "#ff6467"
  destructiveForeground: "#f0fdfa"
  success: "#4ade80"
  warning: "#fbbf24"
  border: "rgba(255, 255, 255, 0.10)"
  input: "rgba(255, 255, 255, 0.15)"
  ring: "#00bba7"

customCSS: |
  :root {
    --sh-bg: #081515;
    --sh-card: #0b2221;
    --sh-surface: #1a3836;
    --sh-fg: #f0fdfa;
    --sh-muted: #7ec0b7;
    --sh-ring: #00bba7;
    --sh-primary: #00d5be;
    --sh-primary-fg: #022f2e;
    --sh-border: rgba(255, 255, 255, 0.10);
    --sh-input: rgba(255, 255, 255, 0.15);
  }
  /* Hermes Agent Modern Theme: the shared style, used by every palette.
     Colors come only from the --sh-* variables; make_themes.py fills them in
     per palette. Edit this file, then rerun make_themes.py. */

  body { -webkit-font-smoothing: antialiased; }
  ::selection { background: color-mix(in srgb, var(--sh-primary) 35%, transparent); }

  /* ---------- typography: one family, sentence case, no tracking ---------- */
  .font-mondwest, .font-compressed, .font-expanded, .font-collapse,
  .font-courier, .font-display, button.font-mono {
    font-family: var(--theme-font-sans) !important;
  }
  .uppercase { text-transform: none !important; }
  [class*="tracking-["], .tracking-wide, .tracking-wider, .tracking-widest {
    letter-spacing: normal !important;
  }
  h1, h2, h3 { letter-spacing: -0.015em !important; }
  h1 { font-size: 15px !important; font-weight: 600 !important; }
  h3 { font-size: 15px !important; font-weight: 600 !important; }
  .grain::after { display: none !important; }

  /* ---------- borders: hairline everywhere ---------- */
  [class*="border-current/"], [class*="border-midground/"] {
    border-color: var(--sh-border) !important;
  }

  /* ---------- sidebar ---------- */
  #app-sidebar { background: var(--sh-card) !important; border-color: var(--sh-border) !important; }
  #app-sidebar a[class*="group/nav"] {
    margin: 1px 8px; padding: 6px 10px !important; gap: 10px !important;
    border-radius: 6px; font-size: 14px !important; font-weight: 500;
    color: var(--sh-muted) !important;
    transition: background-color .12s ease, color .12s ease;
  }
  #app-sidebar a[class*="group/nav"] svg { width: 16px; height: 16px; opacity: .9; }
  #app-sidebar a[class*="group/nav"]:hover { background: var(--sh-surface); color: var(--sh-fg) !important; }
  #app-sidebar a[class*="group/nav"][aria-current="page"] {
    background: color-mix(in srgb, var(--sh-primary) 14%, var(--sh-surface));
    color: var(--sh-fg) !important;
  }
  #app-sidebar a[class*="group/nav"][aria-current="page"] svg { color: var(--sh-primary); opacity: 1; }
  #app-sidebar a[class*="group/nav"] > span.absolute { display: none !important; }
  #app-sidebar span[class*="leading-[0.95]"] {
    font-size: 15px !important; font-weight: 600 !important;
    line-height: 1.15 !important; letter-spacing: -0.015em !important;
  }

  /* ---------- buttons: flat outline + primary ---------- */
  button[class*="shadow-[inset"] {
    box-shadow: none !important;
    border: 1px solid var(--sh-input) !important;
    border-radius: 6px !important;
    background: transparent !important;
    font-size: 13px !important; font-weight: 500 !important;
    padding: 6px 12px !important; gap: 6px;
    transition: background-color .12s ease;
  }
  button[class*="shadow-[inset"]:hover { background: var(--sh-surface) !important; }
  button[class*="shadow-[inset"]:active { filter: none !important; }
  button.bg-midground, a.bg-midground {
    background: var(--sh-primary) !important; color: var(--sh-primary-fg) !important;
    border-radius: 6px;
  }

  /* ---------- segmented toggles -> pill tabs ---------- */
  .inline-flex.border.w-fit {
    background: var(--sh-surface) !important; border: 0 !important;
    border-radius: 8px; padding: 3px; gap: 2px;
  }
  .inline-flex.border.w-fit > button {
    border: 0 !important; border-radius: 6px; height: 28px !important;
    font-weight: 500; color: var(--sh-muted) !important; background: transparent !important;
  }
  .inline-flex.border.w-fit > button.bg-midground {
    background: var(--sh-bg) !important; color: var(--sh-fg) !important;
    box-shadow: 0 0 0 1px var(--sh-input);
  }

  /* ---------- cards & rows ---------- */
  main [class~="border"]:not(button):not(a):not(span):not(input):not(select):not(textarea):not(.inline-flex) {
    border-radius: 12px;
  }
  main [class~="border"] [class~="border"]:not(button):not(a):not(span):not(input):not(select):not(textarea):not(.inline-flex) {
    border-radius: 8px;
  }
  main .border.bg-background-base\/80 { background: var(--sh-card) !important; }

  /* ---------- muted secondary text ---------- */
  .text-muted-foreground, .text-text-secondary, main .font-mono-ui {
    color: var(--sh-muted) !important;
  }

  /* ---------- badges ---------- */
  span[class*="font-compressed"][class*="border"] {
    border-radius: 6px; font-size: 12px !important; font-weight: 500;
    padding: 2px 8px !important;
  }

  /* ---------- form controls ---------- */
  input, select, textarea {
    border-radius: 6px !important; border-color: var(--sh-input) !important;
  }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible, a:focus-visible {
    outline: none !important;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--sh-ring) 50%, transparent) !important;
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
